name: playverse
description: "Your sport. Your teams. Your arena."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/teams/
    - assets/images/teams/nfl/
    - assets/images/teams/nfl/afc/
    - assets/images/teams/nfl/afc/east/
    - assets/images/teams/nfl/afc/north/
    - assets/images/teams/nfl/afc/south/
    - assets/images/teams/nfl/afc/west/
    - assets/images/teams/nfl/nfc/
    - assets/images/teams/nfl/nfc/east/
    - assets/images/teams/nfl/nfc/north/
    - assets/images/teams/nfl/nfc/south/
    - assets/images/teams/nfl/nfc/west/
